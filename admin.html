<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت سفارش‌ها</title><style>body{font-family:Tahoma;background:#f5f7fb;margin:0}.wrap{max-width:900px;margin:auto;padding:20px}.box{background:#fff;border-radius:20px;padding:18px;margin:12px 0}.input,button{padding:12px;border-radius:12px;border:1px solid #ddd}button{cursor:pointer;background:#2478ff;color:#fff;border:0}.order{border-top:1px solid #eee;padding:14px 0}.status{padding:8px;background:#f3f5f8;border-radius:10px;display:inline-block;margin:4px}.danger{color:#b42318}</style></head><body><div class="wrap"><div class="box"><h2>پنل مدیریت سفارش‌ها</h2><input id="key" class="input" placeholder="ADMIN_KEY"><button onclick="load()">ورود / بروزرسانی</button><p id="msg"></p></div><div id="list"></div></div><script>async function load(){const key=document.querySelector('#key').value;const r=await fetch('/api/admin/orders',{headers:{'x-admin-key':key}});const d=await r.json();if(!r.ok){document.querySelector('#msg').innerHTML='<span class="danger">'+d.error+'</span>';return}document.querySelector('#msg').textContent='سفارش‌ها بارگذاری شد';window.adminKey=key;document.querySelector('#list').innerHTML=d.map(o=>`<div class="box order"><b>${o.id}</b><div>اپراتور: ${o.operator} | مبلغ: ${o.amount.toLocaleString('fa-IR')} تومان | شماره: ${o.mobile}</div><div class="status">${o.status}</div><div><button onclick="setStatus('${o.id}','پرداخت تأیید شد')">تأیید واریز</button> <button onclick="setStatus('${o.id}','شارژ انجام شد')">شارژ انجام شد</button> <button onclick="setStatus('${o.id}','رد شد')">رد سفارش</button></div></div>`).join('')}async function setStatus(id,status){await fetch('/api/admin/orders/'+id+'/status',{method:'POST',headers:{'content-type':'application/json','x-admin-key':window.adminKey},body:JSON.stringify({status})});load()}</script></body></html>
